[project]
name = "sotamos"
version = "0.1.0"
description = "Sampling-rate-aware MOS prediction for AudioMOS 2025 Track 3 (replicating and improving on HighRateMOS)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=4.46,<5",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.26",
    "matplotlib>=3.9",
    "torchvision==0.23.0",
    "utmosv2 @ git+https://github.com/Scicom-AI-Enterprise-Organization/faster-UTMOSv2",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sotamos"]
